# Linker configuration for two compute units of salsun2d_band_kernel on
# Alveo U250: one in SLR3 with DDR[3], one in SLR2 with DDR[2]. The host
# (salsun2d_band_mex) splits the bands of a frame between them.
#
# The placer spreads the logic and the post-route physical optimization
# recovers the few ps by which the shell clocks have missed timing in
# these placements.

[connectivity]
nk=salsun2d_band_kernel:2
slr=salsun2d_band_kernel_1:SLR3
sp=salsun2d_band_kernel_1.src:DDR[3]
sp=salsun2d_band_kernel_1.params:DDR[3]
sp=salsun2d_band_kernel_1.stats_in:DDR[3]
sp=salsun2d_band_kernel_1.dst:DDR[3]
sp=salsun2d_band_kernel_1.stats_out:DDR[3]
slr=salsun2d_band_kernel_2:SLR2
sp=salsun2d_band_kernel_2.src:DDR[2]
sp=salsun2d_band_kernel_2.params:DDR[2]
sp=salsun2d_band_kernel_2.stats_in:DDR[2]
sp=salsun2d_band_kernel_2.dst:DDR[2]
sp=salsun2d_band_kernel_2.stats_out:DDR[2]

[vivado]
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
