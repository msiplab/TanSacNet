# Linker configuration for salsun2d_band_kernel on Alveo U250
#
# The band kernel keeps only a band with its halo on chip, so it fits in
# one SLR. Place it in SLR0 and connect all ports to DDR[0] (in SLR0), so
# that no path crosses an SLR boundary.

[connectivity]
nk=salsun2d_band_kernel:1
slr=salsun2d_band_kernel_1:SLR0
sp=salsun2d_band_kernel_1.src:DDR[0]
sp=salsun2d_band_kernel_1.params:DDR[0]
sp=salsun2d_band_kernel_1.stats_in:DDR[0]
sp=salsun2d_band_kernel_1.dst:DDR[0]
sp=salsun2d_band_kernel_1.stats_out:DDR[0]
