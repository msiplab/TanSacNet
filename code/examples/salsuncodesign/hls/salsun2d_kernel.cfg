# Linker configuration for salsun2d_kernel on Alveo U250
#
# The kernel fits in one SLR (BRAM 74%, URAM 59%, LUT 60% of an SLR after
# HLS). Place it in SLR0, which the platform leaves almost empty, and
# connect all ports to DDR[0], which is located in SLR0, so that no path
# crosses an SLR boundary.

[connectivity]
nk=salsun2d_kernel:1
slr=salsun2d_kernel_1:SLR0
sp=salsun2d_kernel_1.src:DDR[0]
sp=salsun2d_kernel_1.params:DDR[0]
sp=salsun2d_kernel_1.dst:DDR[0]
sp=salsun2d_kernel_1.theta:DDR[0]
