# Linker configuration for three compute units of salsun2d_band_df on
# Alveo U250: SLR3 with DDR[3], SLR2 with DDR[2] and SLR0 with DDR[0]
# (SLR1 holds most of the shell); every port of a unit on its own bank.

[connectivity]
nk=salsun2d_band_df:3
slr=salsun2d_band_df_1:SLR3
sp=salsun2d_band_df_1.src:DDR[3]
sp=salsun2d_band_df_1.prm:DDR[3]
sp=salsun2d_band_df_1.wmem:DDR[3]
sp=salsun2d_band_df_1.bmem:DDR[3]
sp=salsun2d_band_df_1.lnmem:DDR[3]
sp=salsun2d_band_df_1.stats_in:DDR[3]
sp=salsun2d_band_df_1.dst:DDR[3]
sp=salsun2d_band_df_1.stats_out:DDR[3]
sp=salsun2d_band_df_1.qmem:DDR[3]
slr=salsun2d_band_df_2:SLR2
sp=salsun2d_band_df_2.src:DDR[2]
sp=salsun2d_band_df_2.prm:DDR[2]
sp=salsun2d_band_df_2.wmem:DDR[2]
sp=salsun2d_band_df_2.bmem:DDR[2]
sp=salsun2d_band_df_2.lnmem:DDR[2]
sp=salsun2d_band_df_2.stats_in:DDR[2]
sp=salsun2d_band_df_2.dst:DDR[2]
sp=salsun2d_band_df_2.stats_out:DDR[2]
sp=salsun2d_band_df_2.qmem:DDR[2]
slr=salsun2d_band_df_3:SLR0
sp=salsun2d_band_df_3.src:DDR[0]
sp=salsun2d_band_df_3.prm:DDR[0]
sp=salsun2d_band_df_3.wmem:DDR[0]
sp=salsun2d_band_df_3.bmem:DDR[0]
sp=salsun2d_band_df_3.lnmem:DDR[0]
sp=salsun2d_band_df_3.stats_in:DDR[0]
sp=salsun2d_band_df_3.dst:DDR[0]
sp=salsun2d_band_df_3.stats_out:DDR[0]
sp=salsun2d_band_df_3.qmem:DDR[0]

[vivado]
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
